name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run unit tests
        run: |
          python -m unittest tests.test_retrainopt_planner tests.test_retrainopt_smoke tests.test_retrainopt_example

      - name: Run example
        run: |
          python examples/minimal_array_timeline.py

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Upload distributions as artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  wheel-smoke:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download built distributions
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install dist/*.whl

      - name: Smoke test installed package
        run: |
          retrainopt --help
          python - <<'PY'
          from retrainopt import PlannerConfig, RetrainingPlanner
          from retrainopt.adapters import ArrayTimelineAdapter, PrototypeModelAdapter

          timeline = ArrayTimelineAdapter(
              train_blocks=[[((0.0,), 0), ((1.0,), 1)]],
              eval_blocks=[[((0.1,), 0), ((0.9,), 1)]],
          )
          planner = RetrainingPlanner(
              timeline,
              PrototypeModelAdapter(),
              config=PlannerConfig(n_choices=(1.0,), time_cost_weight=0.0, loss_cost_weight=1.0),
          )
          result = planner.plan(method="exact")
          assert result.method == "exact"
          assert len(result.decisions) == 1
          print(result.to_dict())
          PY

  botorch-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install package with BoTorch extra
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .[botorch]

      - name: Run BoTorch backend integration test
        run: |
          python -m unittest tests.test_retrainopt_botorch
