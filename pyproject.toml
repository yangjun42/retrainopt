[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "retrainopt"
version = "0.2.0rc1"
description = "RetrainOpt - Cost-aware retraining planning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["retraining", "model-maintenance", "cost-aware", "time-sliced-datasets"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
sklearn = [
    "scikit-learn>=1.4.2",
]
torch = [
    "torch>=2.4",
]
botorch = [
    "botorch>=0.16.1",
    "gpytorch",
    "torch>=2.4",
]

[dependency-groups]
test = ["pytest>=8"]
build = ["build>=1.2", "twine>=6", "setuptools>=77", "wheel"]
docs = ["sphinx>=8", "myst-parser>=4", "furo>=2024.8.6"]

[project.urls]
Homepage = "https://github.com/yangjun42/retrainopt"
Repository = "https://github.com/yangjun42/retrainopt"
Issues = "https://github.com/yangjun42/retrainopt/issues"
Documentation = "https://yangjun42.github.io/retrainopt/"

[project.scripts]
retrainopt = "retrainopt.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["retrainopt*"]

[tool.setuptools.package-data]
retrainopt = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Reproducible CPU development/CI. Published extras remain accelerator-neutral.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
